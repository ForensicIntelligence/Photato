name: Photato
options:
  minimumXcodeGenVersion: 2.45.2
  xcodeVersion: "27.0"
  projectFormat: xcode16_0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
    AppStore:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
fileGroups:
  - README.md
  - CONTRIBUTING.md
  - Package.swift
  - project.yml
  - scripts
targets:
  PhotoCraftCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PhotoCraftCore
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.photocraft.swift.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  PhotoCraftImaging:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PhotoCraftImaging
        type: syncedFolder
    dependencies:
      - target: PhotoCraftCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.photocraft.swift.imaging
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  PhotoCraftAI:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PhotoCraftAI
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.photocraft.swift.ai
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Photato:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhotoCraft
        type: syncedFolder
      - path: LICENSE-MIT
        buildPhase: resources
      - path: LICENSE-APACHE
        buildPhase: resources
      - path: LICENSE-psd-tools
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: ATTRIBUTION.md
        buildPhase: resources
      - path: scripts/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: scripts/ProjectLinks.json
        buildPhase: resources
      - path: Assets/PhotatoIcon.png
        buildPhase: none
    dependencies:
      - target: PhotoCraftCore
        embed: false
      - target: PhotoCraftImaging
        embed: false
      - target: PhotoCraftAI
        embed: false
    settings:
      base:
        PRODUCT_NAME: Photato
        PRODUCT_MODULE_NAME: PhotoCraft
        USE_RECURSIVE_SCRIPT_INPUTS_IN_SCRIPT_PHASES: YES
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.photato
        INFOPLIST_FILE: scripts/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        AppStore:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: PATM9DNCLA
          CODE_SIGN_ENTITLEMENTS: scripts/Photato-AppStore.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_USER_SELECTED_FILES: readwrite
          ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Build Photato icon
        script: '"$SRCROOT/scripts/build-xcode-icon.sh"'
        inputFiles:
          - $(SRCROOT)/Assets/PhotatoIcon.png
          - $(SRCROOT)/scripts/build-xcode-icon.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Photato.iconset
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Photato.icns
      - name: Copy optional person feature model
        script: '"$SRCROOT/scripts/copy-people-model.sh" "$SRCROOT" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Assets/GeneratedModels/
          - $(SRCROOT)/scripts/copy-people-model.sh
          - $(SRCROOT)/scripts/verify-people-model.py
          - $(SRCROOT)/scripts/copy-upscale-model.sh
          - $(SRCROOT)/scripts/verify-upscale-model.py
          - $(SRCROOT)/LICENSE-RealESRGAN
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PeopleParts.mlmodelc
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PeopleParts.provenance.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LocalUpscale.mlmodelc
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LocalUpscale.provenance.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE-RealESRGAN
schemes:
  Photato:
    build:
      targets:
        Photato: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: AppStore
